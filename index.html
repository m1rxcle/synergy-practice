<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<script src="app.js" defer></script>
		<title>Калькулятор</title>
	</head>
	<body>
		<main class="card">
			<h1 class="card-title">Калькулятор</h1>
			<hr />
			<div class="card-inputs_container">
				<input class="card-input" id="firstNumber" placeholder="Первое число" />
				<input class="card-input" id="secondNumber" placeholder="Второе число" />
			</div>
			<div class="card-buttons_container">
				<button class="card-button" id="plus">Cумма</button>
				<button class="card-button" id="minus">Разность</button>
				<button class="card-button" id="multiply">Произведение</button>
				<button class="card-button" id="divide">Деление</button>
			</div>
			<div class="card-result_container">
				<div class="card-result_text">
					<p class="card-result_title">Результат:</p>
					<span class="card-result" id="result">0</span>
				</div>

				<div class="card-error_container hidden" id="error-container">
					<hr />

					<span id="error" class="card-error"></span>
				</div>
			</div>
		</main>
	</body>
</html>
