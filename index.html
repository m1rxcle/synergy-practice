<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<script src="app.js" defer></script>
		<title>Счетчик</title>
	</head>
	<body>
		<main>
			<section class="counter-wrapper">
				<div id="counter-container" class="counter-container">
					<span id="output" class="counter"></span>
				</div>
				<div class="buttons">
					<button id="increment" class="increment">Плюс</button>
					<button id="decrement" class="decrement">Минус</button>
				</div>
				<div id="message-container" class="message-container closed">
					<p id="message" class="message">Вы достигли экстремального значения!</p>
				</div>
			</section>
		</main>
	</body>
</html>
